<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8"/>
	<title>This device is disabled</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#242f3f" />
	<link rel="manifest" href="manifest.webmanifest" />
	<style>
		html, body {
			height: 100%;
			width: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}
		.info {
			margin: 0;
			position: absolute;
			top: 50%;
			left: 50%;
			-ms-transform: translateX(-50%) translateY(-50%);
			transform: translateX(-50%) translateY(-50%);
			
			background-color: rgba(255, 255, 255, 0.75);
			border-radius: 16px;
			padding: 50px 100px;
		}
		h1, p {
			text-align: center;
		}
		.loader-wrapper {
			width: 100%;
			height: 100%;
			position: absolute;
			top: 0;
			left: 0;
			background-color: #242f3f;
			display:flex;
			justify-content: center;
			align-items: center;
		}
		.loader {
			display: inline-block;
			width: 30px;
			height: 30px;
			position: relative;
			border: 4px solid #Fff;
			animation: loader 2s infinite ease;
		}
		.loader-inner {
			vertical-align: top;
			display: inline-block;
			width: 100%;
			background-color: #fff;
			animation: loader-inner 2s infinite ease-in;
		}
		@keyframes loader {
			0% { transform: rotate(0deg);}
			25% { transform: rotate(180deg);}
			50% { transform: rotate(180deg);}
			75% { transform: rotate(360deg);}
			100% { transform: rotate(360deg);}
		}
		@keyframes loader-inner {
			0% { height: 0%;}
			25% { height: 0%;}
			50% { height: 100%;}
			75% { height: 100%;}
			100% { height: 0%;}
		}
	</style>
	<script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
	<script>
		// loader
		$(window).on("load",function(){
			$(".loader-wrapper").fadeOut("slow");
		});
	</script>
</head>
<body>
	<div class="info">
		<h1>This device is disabled</h1>
		<p>This device is the property of A School Somewhere</p>
		<p>
			Please return to:<br />
			A School Somewhere<br />
			1234 School St.<br />
			Somewhere, AR 12345<br />
			(555) 555-5555
		</p>
		<p>This device's serial number is <span id="serial">[Loading...]</span></p>
	</div>
	<div style="z-index: -1" id="background">
		<img data-depth="0.4" src="clouds.webp" style="width: 120vw; filter: contrast(50%);" />
		<img data-depth="0.8" src="background.webp" style="width: 110vw; filter: contrast(50%);"/>
		<div data-depth="0.2" style="padding: 20px 30px"><img src="logo.svg" /></div>
	</div>
	<div class="loader-wrapper">
		<span class="loader"><span class="loader-inner"></span></span>
	</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/parallax/3.1.0/parallax.min.js"></script>
	<script src="app.js"></script>
</body>
